name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync
        shell: bash

      - run: uv run python tools/build_exes.py play
        shell: bash

      - run: uv run python tools/pack_release.py
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: PapaSangre-Windows
          path: dist/PapaSangre-Windows-*.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - run: uv run python tools/build_exes.py play

      - run: uv run python tools/pack_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: PapaSangre-macOS
          path: dist/PapaSangre-macOS-*.zip

  build-linux:
    # ubuntu-20.04 targets glibc 2.31, which runs on all major distros
    # released 2020 or later (Ubuntu 20.04+, Debian 11+, Fedora 33+).
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ autoconf automake libtool pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Build Linux vendors (OpenAL Soft, makemhr, espeak-ng)
        run: bash tools/build_linux_vendors.sh

      - run: uv run python tools/build_exes.py play

      - run: uv run python tools/pack_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: PapaSangre-Linux
          path: dist/PapaSangre-Linux-*.zip

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
